  <g fill="none" stroke="#e6d2b5" stroke-opacity=".18" stroke-width="2"><path d="M712 330q48 -20 96 0M712 380q48 -20 96 0M712 430q48 -20 96 0"/></g>
  <rect width="1200" height="700" fill="url(#vig)"/>
