<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34312d"/><stop offset=".6" stop-color="#22201e"/><stop offset="1" stop-color="#151413"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b3732"/><stop offset=".45" stop-color="#1d1c1a"/><stop offset="1" stop-color="#2a2724"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#e6d2b5" stop-opacity=".55"/><stop offset=".35" stop-color="#e6d2b5" stop-opacity=".16"/><stop offset="1" stop-color="#e6d2b5" stop-opacity="0"/></radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1a18"/><stop offset="1" stop-color="#0d0c0b"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <pattern id="pole" width="44" height="44" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><rect width="44" height="22" fill="#e6d2b5" opacity=".85"/><rect y="22" width="44" height="22" fill="#2a2724"/></pattern>
    <radialGradient id="vig" cx=".5" cy=".45" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#wall)"/>
  <!-- painéis da parede -->
  <g stroke="#e6d2b5" stroke-opacity=".07" stroke-width="2"><path d="M0 0V560M200 0V560M400 0V560M600 0V560M800 0V560M1000 0V560M1200 0V560"/></g>
