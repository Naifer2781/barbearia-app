  <rect x="480" y="352" width="190" height="8" rx="3" fill="#0f0e0d" stroke="#e6d2b5" stroke-opacity=".25"/>
  <g fill="#12110f" stroke="#e6d2b5" stroke-opacity=".22"><rect x="496" y="306" width="22" height="46" rx="6"/><rect x="526" y="318" width="18" height="34" rx="5"/><rect x="552" y="296" width="26" height="56" rx="7"/><rect x="590" y="314" width="20" height="38" rx="5"/><rect x="620" y="302" width="24" height="50" rx="6"/></g>
