    <rect x="655" y="500" width="210" height="62" rx="24"/>
    <rect x="688" y="296" width="144" height="214" rx="44"/>
    <rect x="714" y="228" width="92" height="66" rx="26"/>
    <rect x="630" y="466" width="56" height="16" rx="8"/><rect x="834" y="466" width="56" height="16" rx="8"/>
    <rect x="652" y="478" width="14" height="30" rx="5"/><rect x="854" y="478" width="14" height="30" rx="5"/>
    <path d="M700 562l-44 56h210l-44-56z" opacity=".0"/>
