  <g fill="none" stroke="#e6d2b5" stroke-opacity=".5" stroke-width="2"><path d="M300 0V96M600 0V70M900 0V96"/></g>
  <g><circle cx="300" cy="130" r="190" fill="url(#glow)"/><circle cx="600" cy="110" r="210" fill="url(#glow)"/><circle cx="900" cy="130" r="190" fill="url(#glow)"/></g>
  <g fill="#1a1918" stroke="#e6d2b5" stroke-opacity=".6" stroke-width="2"><path d="M262 130Q300 80 338 130Z"/><path d="M556 108Q600 54 644 108Z"/><path d="M862 130Q900 80 938 130Z"/></g>
  <g fill="#f3e4c9"><ellipse cx="300" cy="132" rx="22" ry="5"/><ellipse cx="600" cy="110" rx="24" ry="5"/><ellipse cx="900" cy="132" rx="22" ry="5"/></g>
  <!-- espelhos -->
  <g><rect x="110" y="170" width="330" height="330" rx="26" fill="url(#glass)" stroke="#e6d2b5" stroke-opacity=".55" stroke-width="3"/>
     <rect x="124" y="184" width="302" height="302" rx="18" fill="none" stroke="#e6d2b5" stroke-opacity=".18" stroke-width="1.5"/>
     <path d="M150 480L330 190h60L210 480Z" fill="url(#shine)"/></g>
  <g><rect x="940" y="190" width="170" height="310" rx="85" fill="url(#glass)" stroke="#e6d2b5" stroke-opacity=".55" stroke-width="3"/>
     <path d="M975 480L1060 210h28L1003 480Z" fill="url(#shine)"/></g>
